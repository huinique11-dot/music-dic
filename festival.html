<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뮤직 페스티벌 랩 - 음악 취향 데이터 기반 축제 기획</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- QR 코드 생성 / 프로필 카드 이미지 저장용 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ===== 테마 토큰 ===== */
:root, [data-theme="neo"] {
  --bg: #fff1c9; --bg2: #fff1c9; --panel: #ffffff; --panel2: #fffaf0; --ink: #111111; --muted: #555;
  --accent: #ff4fa3; --accent2: #3d5afe; --accent3: #00c389; --warn: #ff5a1f;
  --line: #111; --bw: 3px; --shadow: 5px 5px 0 #111; --radius: 10px; --blur: none;
  --chip: #ffffff; --chip-on: #111; --chip-on-ink: #fff; --mark: #fff36b;
}
[data-theme="y2k"] {
  --bg: #e9d8ff; --bg2: linear-gradient(135deg,#ffd6f5 0%,#d6e4ff 45%,#c9fff2 100%);
  --panel: rgba(255,255,255,.55); --panel2: rgba(255,255,255,.35); --ink: #2a1a4a; --muted: #6a5a8a;
  --accent: #b44dff; --accent2: #4d7cff; --accent3: #00b3a4; --warn: #ff3d7f;
  --line: rgba(255,255,255,.9); --bw: 1.5px; --shadow: 0 8px 30px rgba(120,60,200,.18); --radius: 22px; --blur: blur(14px);
  --chip: rgba(255,255,255,.6); --chip-on: linear-gradient(135deg,#b44dff,#4d7cff); --chip-on-ink: #fff; --mark: #ffe0fb;
}
[data-theme="dark"] {
  --bg: #0e0f1d; --bg2: #0e0f1d; --panel: #1a1c31; --panel2: #23264a; --ink: #f1f1f8; --muted: #a2a5c4;
  --accent: #ff5fb0; --accent2: #7d8cff; --accent3: #2ee6a6; --warn: #ff8a4c;
  --line: #3b3f6b; --bw: 2px; --shadow: 4px 4px 0 #000; --radius: 12px; --blur: none;
  --chip: #23264a; --chip-on: #ff5fb0; --chip-on-ink: #111; --mark: #5b3a73;
}
[data-theme="light"] {
  --bg: #f4f5fa; --bg2: #f4f5fa; --panel: #ffffff; --panel2: #f8f9fd; --ink: #1b1d29; --muted: #6b6f85;
  --accent: #e8338a; --accent2: #3d5afe; --accent3: #00a676; --warn: #e85a1f;
  --line: #e1e3ee; --bw: 1px; --shadow: 0 4px 16px rgba(20,20,60,.07); --radius: 14px; --blur: none;
  --chip: #ffffff; --chip-on: #1b1d29; --chip-on-ink: #fff; --mark: #ffef9e;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--bg); background-image: var(--bg2); background-attachment: fixed;
  color: var(--ink); min-height: 100vh; padding: 16px;
}
h1, h2, h3, .display { font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif; font-weight: 400; letter-spacing: .3px; }
h2 { font-size: 26px; margin: 0 0 6px; }
h3 { font-size: 19px; margin: 0 0 10px; }
p { line-height: 1.65; }
a { color: var(--accent2); }
mark.user { background: var(--mark); color: inherit; padding: 0 3px; border-radius: 4px; font-weight: 700; }

/* ===== 무대(16:9 / 9:16) 프레임 ===== */
.stage {
  margin: 0 auto; width: 100%; max-width: 1400px; aspect-ratio: 16 / 9; min-height: 640px;
  display: flex; flex-direction: column; overflow: hidden;
  border: var(--bw) solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  background: var(--panel2); backdrop-filter: var(--blur);
}
body.mobile .stage { max-width: 430px; aspect-ratio: 9 / 16; min-height: 0; }
@media (max-width: 820px) {
  body { padding: 0; }
  .stage { aspect-ratio: auto; min-height: 100vh; border-radius: 0; border: 0; max-width: none; }
  body.mobile .stage { max-width: none; aspect-ratio: auto; }
}
.topbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px;
  border-bottom: var(--bw) solid var(--line); background: var(--panel); backdrop-filter: var(--blur);
}
.brand { font-family: 'Black Han Sans'; font-size: 20px; white-space: nowrap; }
.brand span { color: var(--accent); }
.nav { display: flex; gap: 6px; flex: 1; overflow-x: auto; padding: 2px; }
.nav button { white-space: nowrap; flex: none; }
body.mobile .brand { flex-basis: 100%; }
body.mobile .nav { order: 3; flex-basis: 100%; }
.nav button { font-size: 13px; padding: 6px 10px; }
.nav button.on { background: var(--chip-on); color: var(--chip-on-ink); }
.tools { display: flex; gap: 6px; align-items: center; }
.view { flex: 1; overflow: auto; padding: 20px; }
body.mobile .nav button .lbl { display: none; }
body.mobile .view { padding: 14px; }

/* ===== 공통 컴포넌트 ===== */
button, .btn {
  font: inherit; font-weight: 700; cursor: pointer; color: var(--ink);
  background: var(--panel); border: var(--bw) solid var(--line); border-radius: calc(var(--radius) * .7);
  padding: 8px 14px; box-shadow: none; transition: transform .08s, box-shadow .08s;
}
button:hover { transform: translate(-1px,-1px); box-shadow: 2px 2px 0 var(--line); }
[data-theme="y2k"] button:hover { box-shadow: 0 4px 14px rgba(120,60,200,.25); }
button.primary { background: var(--accent); color: #fff; }
button.blue { background: var(--accent2); color: #fff; }
button.green { background: var(--accent3); color: #111; }
button.ghost { background: transparent; }
button.sm { padding: 4px 10px; font-size: 12px; }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.card {
  background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px; backdrop-filter: var(--blur);
}
.card + .card { margin-top: 16px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g-side { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
body.mobile .g2, body.mobile .g3, body.mobile .g-side { grid-template-columns: 1fr; }
@media (max-width: 900px) { .g2, .g3, .g-side { grid-template-columns: 1fr; } }
.sticky { position: sticky; top: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--panel2); }
.tag.pink { background: var(--accent); color: #fff; border-color: transparent; }
.tag.blue { background: var(--accent2); color: #fff; border-color: transparent; }
.tag.green { background: var(--accent3); color: #111; border-color: transparent; }
.step-no { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--panel); font-family: 'Black Han Sans'; margin-right: 8px; }
[data-theme="y2k"] .step-no { background: var(--accent); color: #fff; }

input[type=text], input[type=number], input[type=url], input:not([type]), textarea, select {
  font: inherit; color: var(--ink); width: 100%; padding: 9px 11px;
  background: var(--panel2); border: var(--bw) solid var(--line); border-radius: calc(var(--radius) * .6);
}
textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
input:focus, textarea:focus, select:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
label.f { display: block; font-weight: 700; font-size: 13px; margin: 12px 0 5px; }
input[type=range] { width: 100%; accent-color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 99px;
  background: var(--chip); border: var(--bw) solid var(--line);
}
.chip.on { background: var(--chip-on); color: var(--chip-on-ink); font-weight: 700; }
.chip.on::before { content: '✓ '; }

table.rows { width: 100%; border-collapse: collapse; font-size: 13px; }
table.rows th { text-align: left; font-size: 12px; color: var(--muted); padding: 4px; }
table.rows td { padding: 4px; vertical-align: top; }
table.rows input, table.rows select { padding: 6px 8px; }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 99;
  background: var(--ink); color: var(--panel); padding: 10px 18px; border-radius: 99px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
.notice { border: 2px dashed var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--panel2); font-size: 13px; line-height: 1.6; }
.warn { color: var(--warn); font-weight: 700; }
.ok { color: var(--accent3); font-weight: 700; }

/* ===== 홈 ===== */
.hero { padding: 26px; background: var(--accent); color: #fff; }
[data-theme="y2k"] .hero { background: linear-gradient(120deg,#b44dff,#4d7cff 60%,#00d4c0); }
.hero h1 { font-size: 40px; margin: 0 0 6px; line-height: 1.15; }
.quote { font-size: 15px; line-height: 1.85; border-left: 6px solid var(--accent); padding: 4px 0 4px 16px; margin: 0; }
.flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
body.mobile .flow { grid-template-columns: 1fr; }
@media (max-width: 900px) { .flow { grid-template-columns: 1fr 1fr; } }
.flow .card { cursor: pointer; margin: 0; }
.flow .card:hover { transform: translate(-2px,-2px); }

/* ===== 장바구니 ===== */
.shop-sec h3 { display: flex; align-items: center; }
.shop-sec .no { font-family: 'Black Han Sans'; color: var(--accent); margin-right: 8px; font-size: 22px; }
.cart-list { list-style: none; padding: 0; margin: 8px 0; font-size: 13px; max-height: 340px; overflow: auto; }
.cart-list li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.cart-total { font-family: 'Black Han Sans'; font-size: 22px; }

/* ===== 인스타 프로필 카드 ===== */
.igcard {
  background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-columns: 380px 1fr; aspect-ratio: 16/9;
  max-width: 1100px; margin: 0 auto;
}
.igcard.vertical { grid-template-columns: 1fr; aspect-ratio: auto; max-width: 400px; }
.ig-left { padding: 22px; border-right: var(--bw) solid var(--line); display: flex; flex-direction: column; gap: 12px; background: var(--panel2); }
.igcard.vertical .ig-left { border-right: 0; border-bottom: var(--bw) solid var(--line); }
.ig-right { padding: 20px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.ig-head { display: flex; align-items: center; gap: 16px; }
.ig-avatar {
  width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 42px; flex: none;
  background: var(--panel); border: 4px solid transparent;
  background-image: linear-gradient(var(--panel),var(--panel)), conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);
  background-origin: border-box; background-clip: padding-box, border-box;
}
.ig-stats { display: flex; gap: 14px; text-align: center; flex: 1; justify-content: space-around; }
.ig-stats b { display: block; font-size: 20px; }
.ig-stats span { font-size: 11px; color: var(--muted); }
.ig-name { font-weight: 900; font-size: 15px; }
.ig-name .v { color: #3897f0; }
.ig-title { font-family: 'Black Han Sans'; font-size: 24px; line-height: 1.25; }
.ig-label { font-size: 11px; font-weight: 900; letter-spacing: 1.5px; color: var(--accent); }
.ig-tags { color: var(--accent2); font-size: 13px; font-weight: 700; line-height: 1.7; }
.ig-hl { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.ig-hl div { text-align: center; font-size: 11px; flex: none; width: 58px; }
.ig-hl i { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 4px; border-radius: 50%; border: 2px solid var(--line); font-style: normal; font-size: 22px; background: var(--panel); }
.ig-story { font-size: 14px; line-height: 1.8; }
.consume { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.igcard.vertical .consume { grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .igcard { grid-template-columns: 1fr; aspect-ratio: auto; } .ig-left { border-right: 0; border-bottom: var(--bw) solid var(--line); } .consume { grid-template-columns: 1fr 1fr; } }
.cs { border: var(--bw) solid var(--line); border-radius: calc(var(--radius) * .7); padding: 10px; background: var(--panel2); font-size: 12px; }
.cs b { font-size: 13px; display: block; margin-bottom: 4px; }
.meter { height: 8px; border-radius: 99px; background: var(--line); opacity: .9; overflow: hidden; margin: 6px 0; }
[data-theme="neo"] .meter, [data-theme="light"] .meter { background: #e8e8e8; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* ===== 보드 ===== */
.board { columns: 3 280px; column-gap: 14px; }
body.mobile .board { columns: 1; }
.post { break-inside: avoid; margin-bottom: 14px; }
.post .sec { font-size: 13px; line-height: 1.65; margin: 6px 0; white-space: pre-wrap; }
.post .sec b { color: var(--accent); }
.cmt { font-size: 12px; padding: 7px 9px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); margin-top: 6px; line-height: 1.55; }
.cmt.disc { border: 2px solid var(--accent3); }
.trend { border-left: 6px solid var(--accent2); padding: 10px 12px; background: var(--panel2); border-radius: 6px; margin-bottom: 10px; font-size: 13px; line-height: 1.6; }
.trend.hot { border-left-color: var(--accent); }
.frames { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.frames button { font-size: 11px; font-weight: 500; padding: 3px 8px; }

/* ===== 축제 / 예산 ===== */
.type-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.type-pick button { text-align: left; padding: 14px; }
.type-pick button.on { background: var(--chip-on); color: var(--chip-on-ink); }
.bar { display: flex; height: 26px; border: var(--bw) solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel2); }
.bar i { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; font-size: 12px; margin-top: 8px; align-items: center; }
.legend s { display: inline-block; width: 11px; height: 11px; border-radius: 3px; text-decoration: none; }
.big-num { font-family: 'Black Han Sans'; font-size: 28px; }
.checklist { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.checklist li { padding: 4px 0; }
.glossary { font-size: 12px; line-height: 1.7; }
.glossary b { color: var(--accent); }

/* ===== 청음 부스 ===== */
.tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.track { border: var(--bw) solid var(--line); border-radius: calc(var(--radius) * .8); overflow: hidden; background: var(--panel); }
.track .thumb { aspect-ratio: 16/9; background: #222 center/cover no-repeat; display: grid; place-items: center; color: #fff; font-size: 30px; cursor: pointer; position: relative; }
.track .thumb::after { content: '▶'; position: absolute; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,0,0,.88); display: grid; place-items: center; font-size: 18px; }
.track iframe { width: 100%; aspect-ratio: 16/9; border: 0; display: block; }
.track .meta { padding: 8px 10px; font-size: 13px; }
.qrbox { display: grid; place-items: center; padding: 14px; background: #fff; border-radius: 10px; border: var(--bw) solid var(--line); }
.qrbox img, .qrbox canvas { max-width: 100%; }
.stars button { padding: 0 3px; border: 0; background: transparent; font-size: 22px; box-shadow: none; color: #c9c9c9; }
.stars button.on { color: #ffb400; }
.stars button:hover { transform: scale(1.15); box-shadow: none; }

/* ===== 평가 ===== */
.rubric td, .rubric th { border-bottom: 1px dashed var(--line); padding: 8px 6px; font-size: 13px; vertical-align: top; }
.rubric { width: 100%; border-collapse: collapse; }
.score { font-family: 'Black Han Sans'; font-size: 44px; line-height: 1; }

/* ===== A5 포스터 ===== */
#posterWrap { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: none; overflow: auto; padding: 24px; }
#posterWrap.show { display: block; }
.poster {
  width: 148mm; height: 210mm; margin: 0 auto; background: #111; color: #fff; position: relative; overflow: hidden;
  padding: 12mm 10mm; display: flex; flex-direction: column; gap: 4mm; font-family: 'Noto Sans KR';
}
.poster .pt { font-family: 'Black Han Sans'; font-size: 40px; line-height: 1.05; color: #fff36b; word-break: keep-all; }
.poster .ps { font-size: 15px; font-weight: 700; }
.poster .pd { font-size: 12px; opacity: .85; }
.poster .head { font-family: 'Black Han Sans'; font-size: 30px; line-height: 1.1; }
.poster .sub { font-family: 'Black Han Sans'; font-size: 20px; color: #ff9bd2; }
.poster .rest { font-size: 13px; opacity: .9; }
.poster .foot { margin-top: auto; display: flex; gap: 10px; align-items: flex-end; justify-content: space-between; }
.poster .pqr { background: #fff; padding: 6px; width: 34mm; height: 34mm; }
.poster .pqr img, .poster .pqr canvas { width: 100%; height: 100%; }
.poster .tt { font-size: 10.5px; line-height: 1.6; opacity: .9; }
.poster .blob { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .55; z-index: 0; }
.poster > *:not(.blob) { position: relative; z-index: 1; }
@media print {
  @page { size: A5 portrait; margin: 0; }
  body.printing { padding: 0; background: #fff; }
  body.printing .stage, body.printing .no-print, body.printing .toast { display: none !important; }
  body.printing #posterWrap { position: static; display: block; background: none; padding: 0; }
  body.printing .poster { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ===== 청음 페이지 단독 모드 (QR 접속) ===== */
.booth-only { max-width: 760px; margin: 0 auto; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <header class="topbar">
    <div class="brand">🎪 MUSIC <span>FESTIVAL</span> LAB</div>
    <nav class="nav" id="nav"></nav>
    <div class="tools">
      <select id="themeSel" title="테마 변경" style="width:auto;padding:6px 8px;font-size:13px">
        <option value="neo">🟨 네오브루탈</option>
        <option value="y2k">🫧 Y2K 글래스</option>
        <option value="dark">🌙 다크</option>
        <option value="light">☀️ 라이트</option>
      </select>
      <button class="sm" id="viewToggle" title="화면 비율 전환">📱 모바일 세로(9:16)</button>
    </div>
  </header>
  <main class="view" id="view"></main>
</div>

<div id="posterWrap"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
/* =========================================================
   0. 기본 데이터 (선택지 · 산업 트렌드 · 가상 단가)
   ========================================================= */
const OPTIONS = {
  apps: ['유튜브 뮤직', '멜론', '스포티파이', '지니', '애플뮤직', '바이브', '플로', '유튜브(일반 영상)', '사운드클라우드'],
  places: ['등하굣길', '학원 가는 길', '공부할 때', '운동할 때', '잠들기 전', '샤워할 때', '게임할 때', '혼자 있을 때', '친구들과 함께'],
  times: ['아침', '낮', '저녁', '새벽'],

function loadState() {
  const d = defaultState();
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return d;
    const s = JSON.parse(raw);
    for (const k of Object.keys(d)) {
      if (s[k] === undefined) continue;
      d[k] = (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && s[k] && typeof s[k] === 'object') ? Object.assign(d[k], s[k]) : s[k];
    }
  } catch (e) { /* 저장소 사용 불가 시 기본값 */ }
  return d;
}
let S = loadState();
let saveTimer;
function save() {
  clearTimeout(saveTimer);

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1900); }
function getPath(path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), S); }
function setPath(path, val) {
  const ks = path.split('.'); const last = ks.pop();
  const o = ks.reduce((o, k) => o[k], S); o[last] = val;
}
function ytId(url) { const m = String(url || '').match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(String(url).trim()) ? String(url).trim() : null); }
function copyText(text, msg = '복사되었어요!') {
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(msg)).catch(() => {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(msg); } catch (e) { toast('복사에 실패했어요. 직접 선택해 복사해 주세요.'); }
    ta.remove();
  });
}
function chips(path, list) {
  const cur = getPath(path);
  return `<div class="chips">${list.map(v => `<button type="button" class="chip ${cur.includes(v) ? 'on' : ''}" data-chip="${path}" data-val="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
}
function radios(path, list) {
  const cur = getPath(path);
  return `<div class="chips">${list.map(v => `<button type="button" class="chip ${cur === v ? 'on' : ''}" data-radio="${path}" data-val="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
}

/* =========================================================
   3. AI 분석 엔진 (나 사용설명서)
   - 규칙 기반으로 페르소나를 계산하고, 학생이 쓴 원문은 그대로 인용/강조합니다.
   ========================================================= */
function analyze(c) {
  const has = (arr, ...vals) => vals.filter(v => arr.includes(v)).length;
  const fast = c.bpm.startsWith('빠름'), slow = c.bpm.startsWith('느림');
  const sc = {
    energy: has(c.genres, 'EDM', '힙합', '밴드/록', 'K-Pop') * 2 + (fast ? 3 : 0) + has(c.places, '운동할 때', '게임할 때') + has(c.textures, '묵직한 베이스', '중독성 있는 후렴'),
    mood: has(c.genres, 'R&B', '발라드', '인디/어쿠스틱', '로파이', '재즈', '시티팝', 'OST') * 2 + (slow ? 3 : 0) + has(c.times, '새벽') * 2 + has(c.places, '잠들기 전', '혼자 있을 때', '공부할 때') + has(c.textures, '몽환적인 사운드', '허스키한 보컬', '미니멀/로파이', '어쿠스틱 기타'),
    fandom: c.goods.filter(g => g !== '구매 안 함').length * 2 + has(c.concert, '팬미팅/쇼케이스', '콘서트 관람 경험 있음') + has(c.content, '직캠 시청', '뮤직비디오 반복 시청', '라이브 방송 시청') + has(c.genres, 'K-Pop', 'J-Pop'),
    live: has(c.concert, '콘서트 관람 경험 있음', '페스티벌 가봤음', '버스킹 즐겨 봄', '학교 축제 공연') * 2 + has(c.genres, '밴드/록') * 2 + has(c.textures, '날것의 밴드 사운드') * 2 + has(c.content, '악기 연주/커버') + (c.concert.includes('아직 없지만 꼭 가고 싶음') ? 1 : 0),
    creator: has(c.content, '숏폼 챌린지 제작', '플레이리스트 만들기', '악기 연주/커버', '노래 커버', '덕질/리뷰 계정 운영') * 3 + has(c.content, '숏폼 챌린지 시청'),
    explorer: Math.max(0, c.genres.length - 3) * 2 + has(c.apps, '스포티파이', '사운드클라우드', '애플뮤직') + (c.apps.length >= 3 ? 2 : 0)
  };
  const ranked = Object.entries(sc).sort((a, b) => b[1] - a[1]);
  const [top, second] = ranked;
  let adj = AXES[second[0]].adj;
  if (second[0] === 'mood' && c.times.includes('새벽')) adj = '새벽 감성의';
  if (second[0] === 'energy' && c.places.includes('운동할 때')) adj = '운동 루틴 책임지는';
  const title = `${adj} ${AXES[top[0]].noun}`;
  const keywords = [...c.genres.slice(0, 3), ...c.textures.slice(0, 2), c.bpm ? c.bpm.split(' ')[0] + ' 템포' : '', ...c.times.slice(0, 1).map(t => t + ' 리스너')].filter(Boolean);
  const maxScore = Math.max(1, ...Object.values(sc));
  return { title, emoji: AXES[top[0]].emoji, topAxis: top[0], secondAxis: second[0], scores: sc, maxScore, keywords, at: new Date().toISOString() };
}

const U = s => `<mark class="user">${esc(s)}</mark>`;          // 학생 원문 강조
const joinU = arr => arr.map(U).join(', ');
function soundtrackHTML(c) {
  const artists = splitList(c.artists), songs = splitList(c.songs);
  const p = [];
  if (artists.length) p.push(`당신의 플레이리스트 맨 위에는 ${joinU(artists)}${artists.length > 1 ? '가 나란히' : '가'} 자리하고 있어요.`);
  if (songs.length) p.push(`그중에서도 ${joinU(songs)}${songs.length > 1 ? '는' : '는'} 몇 번을 들어도 질리지 않는 '무한 반복' 트랙이죠.`);
  if (c.story.trim()) p.push(`이 음악이 당신에게 어떤 의미인지, 당신은 이렇게 적었어요.<br>“${U(c.story.trim())}”`);
  const g = c.genres.length ? `${joinU(c.genres)} 장르` : '';
  const t = c.textures.length ? `${joinU(c.textures)}` : '';

const MAP_SCORE = [4, 8, 12, 16, 20];
function festItems() {
  const f = S.fest;
  return [
    ['축제명', !!f.name.trim()],
    ['슬로건', !!f.slogan.trim()],
    ['일시·장소', !!(f.date.trim() && f.venue.trim())],
    ['라인업 3팀 이상', f.lineup.filter(l => l.artist.trim()).length >= 3],
    ['타임테이블', f.timetable.some(t => t.time.trim() && t.act.trim())],
    ['셋리스트', f.setlist.some(s => s.song.trim())],
    ['관람 안내', f.guide.trim().length >= 10],
    ['세부 설명', f.detail.trim().length >= 20]
  ];
}
function myComments() {
  const mine = me();
  const out = [];
  S.board.filter(p => !p.sample && p.id !== S.report.postId).forEach(p => p.comments.forEach(c => { if (c.author === mine) out.push(c); }));
  return out;
}
function countKeys(text, keys) { return keys.filter(k => text.includes(k)).length; }
const INTRO_KEYS = ['장르', 'BPM', '템포', '빠른', '느린', '음색', '가사', '사운드', '리듬', '보컬', '멜로디', '분위기'];
const INDUSTRY_KEYS = ['플랫폼', '스트리밍', '알고리즘', '팬덤', '공연', '페스티벌', '콘서트', '굿즈', '숏폼', '챌린지', '음반', '시장', '산업', '티켓', '밴드', '유통', '추천'];
function constructive(fb) { return fb.good.trim().length >= 10 && fb.suggest.trim().length >= 15; }
function evalAreas() {
  const r = S.report, f = S.fest;
  const introHits = countKeys(r.intro, INTRO_KEYS) + countKeys(r.intro, S.cart.genres);
  const bodyHits = countKeys(r.body, INDUSTRY_KEYS);
  const cm = myComments();
  const disc = cm.filter(c => c.text.includes('[NEW DISCOVERY]'));
  const items = festItems();
  const okItems = items.filter(i => i[1]).length;
  const validTracks = f.setlist.filter(s => ytId(s.url)).length;
  const goodFb = S.feedback.filter(constructive);
  const a1 = [
    { label: 'AI 분석 결과를 바탕으로 자신의 음악 취향(장르, BPM, 음색, 가사 등)을 구체적으로 서술함',
      auto: !!S.profile && r.intro.trim().length >= 80 && introHits >= 2,
      why: `나 사용설명서 ${S.profile ? '생성 ✓' : '미생성'} · 서론 ${r.intro.trim().length}자(80자↑) · 취향 키워드 ${introHits}개(2개↑)` },
    { label: '자신의 음악 취향과 관련된 음악의 산업적 특징(유통 플랫폼, 팬덤 문화, 공연 시장 등)을 파악하여 서술함',
      auto: r.body.trim().length >= 80 && bodyHits >= 2,
      why: `본론 ${r.body.trim().length}자(80자↑) · 산업 키워드 ${bodyHits}개(2개↑)` },
    { label: '동료와의 음악 교류 활동에 성실히 참여함',
      auto: !!r.postId && cm.length >= 1,
      why: `보고서 게시 ${r.postId ? '✓' : '✗'} · 친구 보고서 댓글 ${cm.length}개(1개↑)` },
    { label: '타인의 음악 취향과 다양한 음악 작품을 탐색하고 패들렛에 기록함',
      auto: disc.length >= 1,
      why: `[NEW DISCOVERY] 댓글 ${disc.length}개(1개↑)` }
  ];
  const a2 = [
    { label: '필수 항목(축제명, 슬로건, 일시·장소, 라인업 3팀 이상, 타임테이블, 셋리스트, 관람 안내, 세부 설명)이 포함된 기획안을 완성함',
      auto: okItems === 8, why: `필수 항목 ${okItems}/8 · 미완성: ${items.filter(i => !i[1]).map(i => i[0]).join(', ') || '없음'}` },
    { label: 'A5 홍보물을 완성하여 제출함',
      auto: S.booth.posterMade && !!f.name.trim(), why: `A5 포스터 ${S.booth.posterMade ? '생성 ✓' : '미생성'} (Canva/미리캔버스 제작 시 교사 '인정' 처리)` },
    { label: '행사 셋리스트 청음 부스를 운영함',
      auto: validTracks >= 1 && S.booth.qrMade, why: `유튜브 링크 ${validTracks}곡 · 청음 QR ${S.booth.qrMade ? '생성 ✓' : '미생성'}` },
    { label: '동료의 음악 행사에 대한 구체적이고 건설적인 피드백을 작성함',
      auto: goodFb.length >= 1, why: `건설적 피드백 ${goodFb.length}개 / 전체 ${S.feedback.length}개` }
  ];
  const resolve = (arr, man) => arr.map((x, i) => ({ ...x, final: man[i] === 1 ? true : man[i] === -1 ? false : x.auto, man: man[i] }));
  const A1 = resolve(a1, S.manual.a1), A2 = resolve(a2, S.manual.a2);
  const s1 = MAP_SCORE[A1.filter(x => x.final).length], s2 = MAP_SCORE[A2.filter(x => x.final).length];
  return { A1, A2, s1, s2, total: S.absent ? 3 : s1 + s2 };
}

function budgetCalc() {
  const f = S.fest;
  const lineup = f.lineup.reduce((a, l) => a + num(l.fee), 0);
  const booths = f.booths.reduce((a, b) => a + num(b.cost), 0);
  const parts = [
    ['음향', num(f.sound), '#3d5afe'], ['조명', num(f.light), '#ffb400'], ['라인업', lineup, '#ff4fa3'],
    ['부스', booths, '#00c389'], ['홍보', num(f.promo), '#9b5cff'], ['기타', num(f.etc), '#888']
  ];
  const spent = parts.reduce((a, p) => a + p[1], 0);
  return { parts, spent, budget: Math.min(num(f.budget), BUDGET_MAX), lineup, booths };
}
function suggestedBudget() {
  // 기획안 구체성 → 추천 배정액 (교사 심사 참고용)
  const f = S.fest, items = festItems().filter(i => i[1]).length;
  let pts = items * 8;                                              // 최대 64
  pts += Math.min(12, f.purpose.length * 3 + (f.purposeText.trim().length >= 40 ? 3 : 0));
  pts += Math.min(12, Math.floor(f.detail.trim().length / 25));
  pts += Math.min(6, f.booths.filter(b => b.name.trim()).length * 2);
  pts += Math.min(6, f.timetable.filter(t => t.act.trim()).length);
  const ratio = Math.min(100, pts) / 100;
  return Math.round((3000000 + ratio * 4000000) / 100000) * 100000;
}
function budgetPanel() {
  const f = S.fest, b = budgetCalc(), remain = b.budget - b.spent;
  const items = festItems();
  const warns = [];
  if (!b.budget) warns.push('선생님께 기획안을 보여 주고 예산을 배정받으세요.');
  if (num(f.sound) > SOUND_MAX) warns.push('음향비는 최대 260만 원이에요.');
  if (num(f.light) > LIGHT_MAX) warns.push('조명비는 최대 40만 원이에요.');
  if (b.budget && remain < 0) warns.push(`예산을 ${won(-remain)} 초과했어요!`);
  if (!num(f.sound)) warns.push('음향비가 0원이면 공연을 할 수 없어요.');
  return `
    <h3>💰 예산 게임</h3>
    <label class="f">교사 배정 예산 (최대 700만 원)</label>
    <div class="row"><input type="number" step="100000" min="0" max="${BUDGET_MAX}" data-path="fest.budget" value="${f.budget}" style="flex:1"><button class="sm" data-act="suggestBudget" title="기획안 구체성 기준 추천액 적용">심사 추천 ${won(suggestedBudget())}</button></div>

  const box = $('#qrbox'); if (!box) return;
  box.innerHTML = '';

  try {
    new QRCode(box, { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.L });
    if (!S.booth.qrMade) { S.booth.qrMade = true; save(); }
  } catch (e) { box.innerHTML = '<div class="small" style="color:#111">링크가 너무 길어 QR을 만들 수 없어요. 곡 수를 줄이거나 유튜브 재생목록 모드를 쓰세요.</div>'; }

document.addEventListener('click', e => {

  if (d.nav) return go(d.nav);
  if (d.chip) { const arr = getPath(d.chip); const i = arr.indexOf(d.val); i >= 0 ? arr.splice(i, 1) : arr.push(d.val); save(); return keepScroll(render); }
  if (d.radio) { setPath(d.radio, getPath(d.radio) === d.val && d.radio === 'cart.bpm' ? '' : d.val); save(); return keepScroll(render); }
  if (d.add) { S.fest[d.add].push(ROW_TPL[d.add]()); save(); return keepScroll(render); }
  if (d.del) { S.fest[d.del].splice(+d.i, 1); save(); return keepScroll(render); }
  if (d.frame) {
    const ta = $(`textarea[data-path="report.${d.frame}"]`);
    const frame = SENTENCE_FRAMES[d.frame][+d.i];
    ta.value = (ta.value.trim() ? ta.value.trimEnd() + ' ' : '') + frame; ta.dispatchEvent(new Event('input', { bubbles: true })); ta.focus();
    const pos = ta.value.lastIndexOf('['); if (pos >= 0) ta.setSelectionRange(pos, ta.value.indexOf(']', pos) + 1);
    return;
  }
  if (d.star) { fbDraft[d.star] = +d.n; return keepScroll(render); }
  if (d.play) return playThumb(t);
  if (d.act && ACTIONS[d.act]) ACTIONS[d.act](t, e);
});
function keepScroll(fn) { const v = $('#view'), y = v.scrollTop; fn(); v.scrollTop = y; }

const ACTIONS = {
  analyze() {
    if (!cartReady()) return toast('05번 최애 장바구니를 먼저 채워 주세요!');
    S.profile = analyze(S.cart); save(); go('profile'); toast('✨ 나 사용설명서가 완성됐어요!');
  },
  cardOrient() { window._cardVertical = !window._cardVertical; if (S.mobile) { S.mobile = false; save(); } render(); },
  saveCard() {
    const el = $('#igcard');
    if (typeof html2canvas === 'undefined') return toast('이미지 라이브러리를 불러오지 못했어요.');
    html2canvas(el, { backgroundColor: null, scale: 2, useCORS: true }).then(cv => {
      const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = `나사용설명서_${me()}.png`; a.click();
    });
  },
  copyPrompt() { copyText(aiPrompt(), 'AI 분석 프롬프트를 복사했어요!'); },
  publish() {
    const r = S.report;
    if (!r.intro.trim() || !r.body.trim() || !r.concl.trim()) return toast('서론·본론·결론을 모두 작성해 주세요.');
    let p = S.board.find(x => x.id === r.postId);
    if (!p) { p = { id: uid(), author: me(), comments: [] }; S.board.unshift(p); r.postId = p.id; }
    Object.assign(p, { author: me(), persona: S.profile ? S.profile.title : '', intro: r.intro, body: r.body, concl: r.concl });
    save(); keepScroll(render); toast('📌 보드에 게시했어요!');
  },
  copyReport() {
    const r = S.report;
    copyText(`[${me()}의 음악 취향 데이터 보고서]${S.profile ? '\n페르소나: ' + S.profile.title : ''}\n\n■ 서론\n${r.intro}\n\n■ 본론\n${r.body}\n\n■ 결론\n${r.concl}`, '패들렛에 붙여넣을 수 있게 복사했어요!');
  },
  discTpl(t) {
    const p = S.board.find(x => x.id === t.dataset.id);
    const ta = $('#cm_' + p.id);
    ta.value = `[NEW DISCOVERY] ${p.author}의 보고서를 읽고 [장르/아티스트/곡명]을 새롭게 알게 되었어. 나도 들어보니 [이유] 때문에 관심이 가!`;
    ta.focus(); const s = ta.value.indexOf('['.repeat(1), 16); ta.setSelectionRange(s, ta.value.indexOf(']', s) + 1);
  },
  comment(t) {
    const p = S.board.find(x => x.id === t.dataset.id);
    const ta = $('#cm_' + p.id), text = ta.value.trim();
    if (!text) return toast('댓글 내용을 입력해 주세요.');
    if (/\[(장르\/아티스트\/곡명|이유)\]/.test(text)) return toast('[ ] 빈칸을 내 말로 채워 주세요!');
    p.comments.push({ author: me(), text, at: Date.now() }); save(); keepScroll(render); toast('💬 댓글을 남겼어요!');
  },
  suggestBudget() { S.fest.budget = suggestedBudget(); save(); keepScroll(render); },
  copyBooth() { copyText(boothUrl(), '청음 링크를 복사했어요!'); },
  downloadQR() {
    const img = $('#qrbox img'), cv = $('#qrbox canvas');
    const src = (img && img.src && img.src.startsWith('data:')) ? img.src : cv ? cv.toDataURL('image/png') : null;
    if (!src) return;
    const a = document.createElement('a'); a.href = src; a.download = `청음QR_${S.fest.name || '축제'}.png`; a.click();
  },
  addFeedback() {
    if (!fbDraft.to.trim()) return toast('피드백 대상을 입력해 주세요.');
    if (!fbDraft.good.trim() || !fbDraft.suggest.trim()) return toast('좋았던 점과 개선 제안을 모두 써 주세요.');
    S.feedback.push({ ...fbDraft, author: me(), at: Date.now() });
    fbDraft = { to: '', lineup: 0, plan: 0, poster: 0, listen: 0, good: '', suggest: '' };
    save(); keepScroll(render); toast('📮 피드백 포스트잇을 붙였어요!');
  },
  delFeedback(t) { S.feedback.splice(+t.dataset.i, 1); save(); keepScroll(render); },
  poster() { openPoster(); },
  copySummary() { copyText(festSummaryText(), '기획 요약서를 복사했어요!'); },
  copyEval() {
    const E = evalAreas();
    const lines = a => a.map((x, i) => `${i + 1}. ${x.final ? '○' : '×'} ${x.label}`).join('\n');
    copyText(`[수행평가 결과] ${me()} ${S.student.cls}\n영역1 ${S.absent ? '-' : E.s1}/20\n${lines(E.A1)}\n영역2 ${S.absent ? '-' : E.s2}/20\n${lines(E.A2)}\n총점 ${E.total}/40`, '평가 결과를 복사했어요!');
  },
  absent(t) { S.absent = t.checked; save(); keepScroll(render); },
  export() {
    const blob = new Blob([JSON.stringify({ app: 'musicFestivalLab', v: 1, ...S }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `음악축제_${me()}_${S.student.cls || ''}.json`.replace(/[\\/:*?"<>|]/g, '-'); a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  import() { $('#fileIn').click(); },
  reset() {
    if (!confirm('이 기기에 저장된 모든 활동 내용을 지울까요? (되돌릴 수 없어요)')) return;
    const theme = S.theme; S = defaultState(); S.theme = theme; save(); render(); toast('초기화했어요.');
  }
};

// 파일 불러오기: 내 파일이면 복원, 친구 파일이면 보고서를 보드에 추가
$('#fileIn').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  let added = 0, restored = false;
  for (const f of files) {
    try {
      const d = JSON.parse(await f.text());
      if (d.app !== 'musicFestivalLab') continue;
      const theirName = (d.student && d.student.name) || '친구';
      const isEmpty = !S.student.name && !S.profile;
      if (isEmpty && files.length === 1 && confirm(`'${theirName}'의 파일이에요. 이 기기에 내 작업으로 복원할까요?\n(취소하면 친구 보고서로 보드에 추가해요)`)) {
        const theme = S.theme; S = Object.assign(defaultState(), d); delete S.app; delete S.v; S.theme = theme; restored = true; continue;
      }
      const r = d.report || {};
      if (r.intro || r.body || r.concl) {
        const id = 'f_' + (r.postId || uid());
        const existing = S.board.find(p => p.id === id);
        const post = { id, author: theirName, persona: d.profile ? d.profile.title : '', intro: r.intro || '', body: r.body || '', concl: r.concl || '', comments: existing ? existing.comments : [] };
        existing ? Object.assign(existing, post) : S.board.push(post);
        added++;
      }
    } catch (err) { toast('파일을 읽지 못했어요: ' + f.name); }
  }
  save(); render();
  toast(restored ? '내 작업을 복원했어요!' : added ? `친구 보고서 ${added}개를 보드에 추가했어요!` : '불러올 보고서가 없어요.');
});

/* =========================================================
   7. A5 포스터 & 기획 요약서
   ========================================================= */
function festSummaryText() {
  const f = S.fest, b = budgetCalc();
  return `[축제 기획 요약서] ${f.name}
슬로건: ${f.slogan}
유형: ${f.type === 'school' ? '학교 축제' : '취향 맞춤형 축제'} / 일시: ${f.date} / 장소: ${f.venue}
목적: ${f.purpose.join(', ')} ${f.purposeText}
라인업: ${f.lineup.filter(l => l.artist).map(l => `${l.tier} ${l.artist}`).join(' / ')}
타임테이블: ${f.timetable.filter(t => t.act).map(t => `${t.time} ${t.stage} ${t.act}`).join(' / ')}
셋리스트: ${f.setlist.filter(s => s.song).map(s => `${s.artist} - ${s.song}`).join(' / ')}
부스: ${f.booths.filter(x => x.name).map(x => `${x.kind} ${x.name}`).join(' / ')}
예산: 배정 ${won(b.budget)} · 집행 ${won(b.spent)} (${b.parts.map(p => `${p[0]} ${won(p[1])}`).join(', ')})
관람 안내: ${f.guide}
세부 설명: ${f.detail}`;
}
function openPoster() {
  const f = S.fest;
  const byTier = n => f.lineup.filter(l => l.tier === n && l.artist.trim()).map(l => esc(l.artist));
  const heads = [...byTier('헤드라이너'), ...byTier('첫 내한/쇼케이스')];
  const subs = byTier('서브 헤드라이너');
  const rest = [...byTier('미들 라인업'), ...byTier('언더카드'), ...byTier('루키')];
  const colors = ['#ff4fa3', '#3d5afe', '#00c389', '#ffb400', '#9b5cff'];
  const blobs = [0, 1, 2].map(i => `<div class="blob" style="width:${60 + i * 25}mm;height:${60 + i * 25}mm;background:${colors[(i + (f.name.length % 5)) % 5]};${['top:-20mm;right:-20mm', 'bottom:30mm;left:-30mm', 'bottom:-40mm;right:-10mm'][i]}"></div>`).join('');
  $('#posterWrap').innerHTML = `
    <div class="row no-print" style="justify-content:center;margin-bottom:14px">
      <button class="primary" id="pPrint">🖨️ 인쇄 / PDF 저장 (A5)</button><button id="pClose">닫기</button>
    </div>
    <div class="poster" id="posterEl">${blobs}
      <div class="pd">${f.type === 'school' ? 'SCHOOL MUSIC FESTIVAL' : 'MUSIC FESTIVAL'}</div>
      <div class="pt">${esc(f.name || '축제명')}</div>
      <div class="ps">${esc(f.slogan)}</div>
      <div class="pd">📅 ${esc(f.date)}<br>📍 ${esc(f.venue)}</div>
      <div style="margin-top:4mm">${heads.length ? `<div class="head">${heads.join(' · ')}</div>` : ''}${subs.length ? `<div class="sub">${subs.join(' · ')}</div>` : ''}${rest.length ? `<div class="rest">${rest.join(' · ')}</div>` : ''}</div>
      <div class="tt">${f.timetable.filter(t => t.act.trim()).slice(0, 6).map(t => `${esc(t.time)} ${esc(t.stage)} ${esc(t.act)}`).join('<br>')}</div>
      <div class="tt">${f.booths.filter(b => b.name.trim()).slice(0, 4).map(b => `◆ ${esc(b.name)}`).join('  ')}</div>
      <div class="foot"><div class="tt" style="max-width:85mm">${esc(f.guide).slice(0, 160)}</div><div><div class="pqr" id="posterQR"></div><div class="pd" style="text-align:center;font-size:9px;margin-top:2px">SCAN · 셋리스트 청음</div></div></div>
    </div>`;
  $('#posterWrap').classList.add('show');
  const url = boothUrl();
  if (url && typeof QRCode !== 'undefined') { try { new QRCode($('#posterQR'), { text: url, width: 160, height: 160, correctLevel: QRCode.CorrectLevel.L }); } catch (e) {} }
  else $('#posterQR').style.display = 'none';
  $('#pClose').onclick = () => $('#posterWrap').classList.remove('show');
  $('#pPrint').onclick = () => { document.body.classList.add('printing'); window.print(); };
  S.booth.posterMade = true; save();
}
window.addEventListener('afterprint', () => document.body.classList.remove('printing'));

/* =========================================================
   8. 시작
   ========================================================= */
(function boot() {
  const m = location.hash.match(/^#booth=(.+)$/);
  if (m) {
    document.documentElement.dataset.theme = 'neo';
    try { return renderBoothOnly(decodeBooth(m[1])); } catch (e) { /* 손상된 링크면 일반 앱 표시 */ }
  }
  render();
})();
</script>
