<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 음악 취향 연구소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- QR 코드 생성용 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ===== 테마 토큰 ===== */
:root, [data-theme="neo"] {
  --bg: #fff1c9; --bg2: #fff1c9; --panel: #ffffff; --panel2: #fffaf0; --ink: #111111; --muted: #555;
  --accent: #ff4fa3; --accent2: #3d5afe; --accent3: #00c389; --warn: #e8481a;
  --line: #111; --bw: 3px; --shadow: 5px 5px 0 #111; --radius: 10px; --blur: none;
  --chip: #ffffff; --chip-on: #111; --chip-on-ink: #fff; --mark: #fff36b;
}
[data-theme="y2k"] {
  --bg: #e9d8ff; --bg2: linear-gradient(135deg,#ffd6f5 0%,#d6e4ff 45%,#c9fff2 100%);
  --panel: rgba(255,255,255,.6); --panel2: rgba(255,255,255,.4); --ink: #2a1a4a; --muted: #6a5a8a;
  --accent: #b44dff; --accent2: #4d7cff; --accent3: #00b3a4; --warn: #e8336f;
  --line: rgba(255,255,255,.95); --bw: 1.5px; --shadow: 0 8px 30px rgba(120,60,200,.18); --radius: 22px; --blur: blur(14px);
  --chip: rgba(255,255,255,.65); --chip-on: linear-gradient(135deg,#b44dff,#4d7cff); --chip-on-ink: #fff; --mark: #ffe0fb;
}
[data-theme="dark"] {
  --bg: #0e0f1d; --bg2: #0e0f1d; --panel: #1a1c31; --panel2: #23264a; --ink: #f1f1f8; --muted: #a2a5c4;
  --accent: #ff5fb0; --accent2: #7d8cff; --accent3: #2ee6a6; --warn: #ff8a4c;
  --line: #3b3f6b; --bw: 2px; --shadow: 4px 4px 0 #000; --radius: 12px; --blur: none;
  --chip: #23264a; --chip-on: #ff5fb0; --chip-on-ink: #111; --mark: #5b3a73;
}
[data-theme="light"] {
  --bg: #f4f5fa; --bg2: #f4f5fa; --panel: #ffffff; --panel2: #f8f9fd; --ink: #1b1d29; --muted: #6b6f85;
  --accent: #e8338a; --accent2: #3d5afe; --accent3: #00a676; --warn: #d9480f;
  --line: #e1e3ee; --bw: 1px; --shadow: 0 4px 16px rgba(20,20,60,.07); --radius: 14px; --blur: none;
  --chip: #ffffff; --chip-on: #1b1d29; --chip-on-ink: #fff; --mark: #ffef9e;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--bg); background-image: var(--bg2); background-attachment: fixed;
  color: var(--ink); min-height: 100vh; padding: 16px;
}
h1, h2, h3, .display { font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif; font-weight: 400; letter-spacing: .3px; }
h2 { font-size: 26px; margin: 0 0 6px; }
h3 { font-size: 19px; margin: 0 0 10px; }
p { line-height: 1.7; }
a { color: var(--accent2); }
mark.user { background: var(--mark); color: inherit; padding: 0 3px; border-radius: 4px; font-weight: 700; }

/* ===== 화면 프레임 (16:9 / 9:16) ===== */
.stage {
  margin: 0 auto; width: 100%; max-width: 1400px; aspect-ratio: 16 / 9; min-height: 640px;
  display: flex; flex-direction: column; overflow: hidden;
  border: var(--bw) solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  background: var(--panel2); backdrop-filter: var(--blur);
}
body.mobile .stage { max-width: 430px; aspect-ratio: 9 / 16; min-height: 0; }
@media (max-width: 820px) {
  body { padding: 0; }
  .stage, body.mobile .stage { aspect-ratio: auto; min-height: 100vh; border-radius: 0; border: 0; max-width: none; overflow: visible; }
  .view { overflow: visible !important; }
}
.topbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px;
  border-bottom: var(--bw) solid var(--line); background: var(--panel); backdrop-filter: var(--blur);
}
.brand { font-family: 'Black Han Sans'; font-size: 20px; white-space: nowrap; cursor: pointer; }
.brand span { color: var(--accent); }
.nav { display: flex; gap: 6px; flex: 1; overflow-x: auto; padding: 2px; }
.nav button { font-size: 13px; padding: 6px 10px; white-space: nowrap; flex: none; }
.nav button.on { background: var(--chip-on); color: var(--chip-on-ink); }
.tools { display: flex; gap: 6px; align-items: center; }
.who { font-size: 12px; font-weight: 700; white-space: nowrap; }
.view { flex: 1; overflow: auto; padding: 20px; }
body.mobile .brand, body.narrow .brand { flex-basis: 100%; }
body.mobile .nav, body.narrow .nav { order: 3; flex-basis: 100%; }
body.mobile .view { padding: 14px; }
@media (max-width: 820px) { .brand { flex-basis: 100%; } .nav { order: 3; flex-basis: 100%; } .view { padding: 14px; } }

/* ===== 공통 컴포넌트 ===== */
button, .btn {
  font: inherit; font-weight: 700; cursor: pointer; color: var(--ink); text-decoration: none; display: inline-block;
  background: var(--panel); border: var(--bw) solid var(--line); border-radius: calc(var(--radius) * .7);
  padding: 8px 14px; transition: transform .08s, box-shadow .08s;
}
button:hover, .btn:hover { transform: translate(-1px,-1px); box-shadow: 2px 2px 0 var(--line); }
[data-theme="y2k"] button:hover { box-shadow: 0 4px 14px rgba(120,60,200,.25); }
button.primary, .btn.primary { background: var(--accent); color: #fff; }
button.blue, .btn.blue { background: var(--accent2); color: #fff; }
button.green, .btn.green { background: var(--accent3); color: #111; }
button.ghost { background: transparent; }
button.sm, .btn.sm { padding: 4px 10px; font-size: 12px; }
button.big, .btn.big { padding: 14px 20px; font-size: 17px; }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.card {
  background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px; backdrop-filter: var(--blur);
}
.card + .card { margin-top: 16px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g-side { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
body.mobile .g2, body.mobile .g3, body.mobile .g-side { grid-template-columns: 1fr; }
@media (max-width: 900px) { .g2, .g3, .g-side { grid-template-columns: 1fr; } }
.sticky { position: sticky; top: 0; }
@media (max-width: 900px) { .sticky { position: static; } }
body.mobile .sticky { position: static; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--panel2); }
.tag.pink { background: var(--accent); color: #fff; border-color: transparent; }
.tag.blue { background: var(--accent2); color: #fff; border-color: transparent; }
.tag.green { background: var(--accent3); color: #111; border-color: transparent; }
.src { display: inline-block; font-size: 11px; color: var(--accent2); font-weight: 700; margin-top: 4px; }

input[type=text], input[type=number], input[type=url], input:not([type]), textarea, select {
  font: inherit; color: var(--ink); width: 100%; padding: 10px 12px;
  background: var(--panel2); border: var(--bw) solid var(--line); border-radius: calc(var(--radius) * .6);
}
textarea { min-height: 90px; resize: vertical; line-height: 1.7; }
input:focus, textarea:focus, select:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
label.f { display: block; font-weight: 700; font-size: 14px; margin: 14px 0 6px; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 14px; font-weight: 500; padding: 8px 14px; border-radius: 99px; background: var(--chip); border: var(--bw) solid var(--line); }
.chip.on { background: var(--chip-on); color: var(--chip-on-ink); font-weight: 700; }
.chip.on::before { content: '✓ '; }

table.rows { width: 100%; border-collapse: collapse; font-size: 13px; }
table.rows th { text-align: left; font-size: 12px; color: var(--muted); padding: 4px; }
table.rows td { padding: 4px; vertical-align: top; }
table.rows input, table.rows select { padding: 6px 8px; }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 99; max-width: 90vw; text-align: center;
  background: var(--ink); color: var(--panel); padding: 12px 20px; border-radius: 99px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
.notice { border: 2px dashed var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--panel2); font-size: 14px; line-height: 1.7; }
.warn { color: var(--warn); font-weight: 700; }
.ok { color: var(--accent3); font-weight: 700; }
[data-theme="neo"] .ok, [data-theme="light"] .ok { color: #008a5e; }

/* ===== 모달 ===== */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 60; display: none; padding: 20px; overflow: auto; }
#modal.show { display: grid; place-items: center; }
#modal .card { max-width: 560px; width: 100%; }

/* ===== 시작 화면 ===== */
.hero { padding: 26px; background: var(--accent); color: #fff; }
[data-theme="y2k"] .hero { background: linear-gradient(120deg,#b44dff,#4d7cff 60%,#00d4c0); }
.hero h1 { font-size: 38px; margin: 0 0 6px; line-height: 1.15; }
.class-pick { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
@media (max-width: 600px) { .class-pick { grid-template-columns: repeat(5, 1fr); } }
body.mobile .class-pick { grid-template-columns: repeat(5, 1fr); }
.class-pick button { padding: 12px 0; font-size: 16px; }
.class-pick button.on { background: var(--chip-on); color: var(--chip-on-ink); }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
@media (max-width: 900px) { .steps { grid-template-columns: 1fr; } }
body.mobile .steps { grid-template-columns: 1fr; }
.steps .card { margin: 0; padding: 14px; }

/* ===== 입력 ===== */
.qno { font-family: 'Black Han Sans'; color: var(--accent); font-size: 22px; margin-right: 6px; }
.progress { height: 12px; border: var(--bw) solid var(--line); border-radius: 99px; overflow: hidden; background: var(--panel2); }
.progress i { display: block; height: 100%; background: var(--accent3); transition: width .3s; }
.genre-row { display: grid; grid-template-columns: 150px 1fr; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
@media (max-width: 600px) { .genre-row { grid-template-columns: 1fr; } }
body.mobile .genre-row { grid-template-columns: 1fr; }
.genre-name { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.genre-name button { padding: 0 7px; font-size: 12px; border-radius: 99px; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rate button { padding: 8px 2px; font-size: 13px; font-weight: 500; }
.rate button.on { background: var(--chip-on); color: var(--chip-on-ink); font-weight: 700; }
.rate button.on.unknown { background: var(--accent2); color: #fff; }
.slider-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: -2px; }
.song-row { display: grid; grid-template-columns: 30px 1fr 1fr; gap: 6px; align-items: center; margin-bottom: 6px; }

/* ===== 결과 ===== */
.radar-wrap { display: grid; place-items: center; }
.radar-wrap svg { width: 100%; max-width: 340px; height: auto; }
.dimbar { display: grid; grid-template-columns: 120px 1fr 40px; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; }
.dimbar .t { height: 12px; border-radius: 99px; background: #e6e6e6; overflow: hidden; }
[data-theme="dark"] .dimbar .t { background: #2c2f55; }
.dimbar .t i { display: block; height: 100%; border-radius: 99px; }
.stmt { border: var(--bw) solid var(--line); border-radius: calc(var(--radius) * .8); padding: 14px; background: var(--panel2); margin-bottom: 12px; }
.stmt h4 { margin: 0 0 6px; font-size: 15px; }
.stmt p { margin: 0 0 6px; font-size: 14px; }
.verdict { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.verdict button { padding: 8px 2px; font-size: 13px; }
.verdict button.on { background: var(--chip-on); color: var(--chip-on-ink); }
.stmt.done { border-color: var(--accent3); }

/* ===== 보고서 ===== */
.frames { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.frames button { font-size: 11px; font-weight: 500; padding: 3px 8px; }
.howto { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.howto li { position: relative; padding: 10px 0 10px 44px; border-bottom: 1px dashed var(--line); font-size: 14px; line-height: 1.6; }
.howto li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 8px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-family: 'Black Han Sans'; }
.mycard { background: var(--panel); border: var(--bw) solid var(--line); border-radius: var(--radius); padding: 18px; max-width: 520px; }
.blank-warn { background: var(--mark); padding: 1px 4px; border-radius: 4px; }

/* ===== 장르 도감 ===== */
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.gcard h3 { display: flex; align-items: center; gap: 8px; }
.gcard dl { margin: 6px 0 0; font-size: 13px; line-height: 1.65; }
.gcard dt { font-weight: 900; color: var(--accent); margin-top: 6px; }
.gcard dd { margin: 0; }

/* ===== 축제 / 예산 ===== */
.type-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.type-pick button { text-align: left; padding: 14px; }
.type-pick button.on { background: var(--chip-on); color: var(--chip-on-ink); }
.bar { display: flex; height: 26px; border: var(--bw) solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel2); }
.bar i { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; font-size: 12px; margin-top: 8px; align-items: center; }
.legend s { display: inline-block; width: 11px; height: 11px; border-radius: 3px; text-decoration: none; }
.checklist { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.checklist li { padding: 4px 0; }
.glossary { font-size: 12px; line-height: 1.7; }
.glossary b { color: var(--accent); }

/* ===== 청음 부스 ===== */
.tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.track { border: var(--bw) solid var(--line); border-radius: calc(var(--radius) * .8); overflow: hidden; background: var(--panel); }
.track .thumb { aspect-ratio: 16/9; background: #222 center/cover no-repeat; display: grid; place-items: center; color: #fff; font-size: 30px; cursor: pointer; position: relative; }
.track .thumb.play::after { content: '▶'; position: absolute; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,0,0,.88); display: grid; place-items: center; font-size: 18px; }
.track iframe { width: 100%; aspect-ratio: 16/9; border: 0; display: block; }
.track .meta { padding: 8px 10px; font-size: 13px; }
.qrbox { display: grid; place-items: center; padding: 14px; background: #fff; border-radius: 10px; border: var(--bw) solid var(--line); }
.qrbox img, .qrbox canvas { max-width: 100%; }
.stars button { padding: 0 3px; border: 0; background: transparent; font-size: 22px; color: #c9c9c9; }
.stars button.on { color: #ffb400; }
.stars button:hover { transform: scale(1.15); box-shadow: none; }
.cmt { font-size: 12px; padding: 8px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); margin-top: 6px; line-height: 1.55; }
.cmt.good { border: 2px solid var(--accent3); }

/* ===== 평가 ===== */
.rubric td, .rubric th { border-bottom: 1px dashed var(--line); padding: 8px 6px; font-size: 13px; vertical-align: top; }
.rubric { width: 100%; border-collapse: collapse; }
.score { font-family: 'Black Han Sans'; font-size: 44px; line-height: 1; }

/* ===== A5 포스터 ===== */
#posterWrap { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: none; overflow: auto; padding: 24px; }
#posterWrap.show { display: block; }
.poster { width: 148mm; height: 210mm; margin: 0 auto; background: #111; color: #fff; position: relative; overflow: hidden; padding: 12mm 10mm; display: flex; flex-direction: column; gap: 4mm; }
.poster .pt { font-family: 'Black Han Sans'; font-size: 40px; line-height: 1.05; color: #fff36b; word-break: keep-all; }
.poster .ps { font-size: 15px; font-weight: 700; }
.poster .pd { font-size: 12px; opacity: .85; }
.poster .head { font-family: 'Black Han Sans'; font-size: 30px; line-height: 1.1; }
.poster .sub { font-family: 'Black Han Sans'; font-size: 20px; color: #ff9bd2; }
.poster .rest { font-size: 13px; opacity: .9; }
.poster .foot { margin-top: auto; display: flex; gap: 10px; align-items: flex-end; justify-content: space-between; }
.poster .pqr { background: #fff; padding: 6px; width: 34mm; height: 34mm; }
.poster .pqr img, .poster .pqr canvas { width: 100%; height: 100%; }
.poster .tt { font-size: 10.5px; line-height: 1.6; opacity: .9; }
.poster .blob { position: absolute; border-radius: 50%; opacity: .5; z-index: 0; }
.poster > *:not(.blob) { position: relative; z-index: 1; }
@media print {
  @page { size: A5 portrait; margin: 0; }
  body.printing { padding: 0; background: #fff; }
  body.printing .stage, body.printing .no-print, body.printing .toast, body.printing #modal { display: none !important; }
  body.printing #posterWrap { position: static; display: block; background: none; padding: 0; }
  body.printing .poster { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
.solo { max-width: 760px; margin: 0 auto; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <header class="topbar">
    <div class="brand" data-nav="home">🎧 나의 음악 취향 <span>연구소</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="tools">
      <span class="who" id="who"></span>
      <select id="themeSel" title="테마 변경" style="width:auto;padding:6px 8px;font-size:13px">
        <option value="neo">🟨 네오브루탈</option>
        <option value="y2k">🫧 Y2K 글래스</option>
        <option value="dark">🌙 다크</option>
        <option value="light">☀️ 라이트</option>
      </select>
      <button class="sm" id="viewToggle" title="화면 비율 전환">📱 9:16</button>
    </div>
  </header>
  <main class="view" id="view"></main>
</div>

<div id="modal"></div>
<div id="posterWrap"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   0. 설정
   ========================================================= */
const CLASS_COUNT = 9;

/* =========================================================
   1. 연구 기반 데이터
   ========================================================= */
// MUSIC 5요인 취향 축 (Rentfrow & Gosling 2003의 4차원 연구 → 이후 5요인으로 발전, Greenberg 외 2015·2022에서 사용)
const DIMS = [
  { k: 'M', name: '잔잔함', en: 'Mellow', emoji: '🌙', color: '#7d8cff', desc: '부드럽고 느긋하며 감성적인 소리. 낭만적이고 차분한 분위기의 음악이에요.' },
  { k: 'U', name: '소박함', en: 'Unpretentious', emoji: '🍃', color: '#00b386', desc: '꾸밈없고 편안한 소리. 어쿠스틱 악기, 단순한 화성, 이야기하듯 담백한 노래예요.' },
  { k: 'S', name: '세련됨', en: 'Sophisticated', emoji: '🎻', color: '#b07a00', desc: '복잡하고 섬세한 소리. 악기 구성이 풍부하고 셈여림·구조의 변화가 큰 음악이에요.' },
  { k: 'I', name: '강렬함', en: 'Intense', emoji: '🔥', color: '#e8481a', desc: '크고 거칠고 에너지 넘치는 소리. 디스토션 기타와 강한 드럼이 중심이에요.' },
  { k: 'C', name: '트렌디함', en: 'Contemporary', emoji: '⚡', color: '#e8338a', desc: '리듬감 있고 전자적인 소리. 비트와 베이스 중심의, 지금 유행하는 사운드예요.' }

const uidOf = (cls, no, name) => `${cls}-${String(no).trim()}-${String(name).trim()}`;
let saveTimer;
function save() {
  if (!UID) return;
  USERS[UID] = S;
  clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set(K_USERS, USERS), 150);
}
function savePref() { store.set(K_PREF, PREF); }
function login(cls, no, name) {
  const id = uidOf(cls, no, name);

  go(S.view && S.view !== 'home' ? S.view : 'input');
}
function logout() { save(); store.set(K_USERS, USERS); UID = null; S = null; store.set(K_LAST, null); loginDraft = { cls: 0, no: '', name: '' }; go('home'); }

function computeDims() {
  const i = S.input, sum = {}, wsum = {};
  DIMS.forEach(d => { sum[d.k] = 0; wsum[d.k] = 0; });
  GENRES.forEach(g => {
    const r = i.genres[g.k];
    if (r === undefined || r < 0) return;              // '잘 몰라요'는 계산에서 제외
    for (const [k, w] of Object.entries(g.w)) { sum[k] += w * r; wsum[k] += w; }
  });
  const c = v => (v - 3) / 2;                           // 1~5 → -1~1
  const t = c(i.tempo), e = c(i.energy), m = c(i.mood), el = i.elements;
  const adj = {
    M: -.5 * e - .3 * t + (el.includes('음색·보컬') ? .15 : 0) + (el.includes('가사') ? .05 : 0) + (el.includes('멜로디') ? .05 : 0),
    U: -.3 * e + .1 * m + (el.includes('가사') ? .15 : 0) + (el.includes('멜로디') ? .05 : 0),
    S: (el.includes('악기 연주') ? .25 : 0),
    I: .5 * e - .3 * m + .2 * t + (el.includes('악기 연주') ? .05 : 0),
    C: .3 * e + .3 * t + .2 * m + (el.includes('비트·리듬') ? .2 : 0)
  };
  const out = {};
  DIMS.forEach(d => {
    const g = wsum[d.k] ? sum[d.k] / wsum[d.k] : .3;
    const s = Math.max(0, Math.min(1, .5 + adj[d.k]));
    out[d.k] = Math.round((g * .75 + s * .25) * 100);
  });
  return out;
}

function radarSVG(a, b) {
  const W = 300, cx = 150, cy = 155, R = 105;
  const pt = (i, r) => { const ang = -Math.PI / 2 + i * 2 * Math.PI / 5; return [cx + Math.cos(ang) * r, cy + Math.sin(ang) * r]; };
  const poly = vals => DIMS.map((d, i) => pt(i, R * (vals[d.k] / 100)).map(n => n.toFixed(1)).join(',')).join(' ');
  const grid = [.25, .5, .75, 1].map(f => `<polygon points="${DIMS.map((d, i) => pt(i, R * f).join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-opacity=".18"/>`).join('');
  const axes = DIMS.map((d, i) => { const [x, y] = pt(i, R); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="currentColor" stroke-opacity=".18"/>`; }).join('');
  const labels = DIMS.map((d, i) => { const [x, y] = pt(i, R + 26); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="currentColor">${d.emoji} ${d.name}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} 310" role="img" aria-label="취향 지도">${grid}${axes}
    <polygon points="${poly(a)}" fill="#ff4fa3" fill-opacity=".28" stroke="#ff4fa3" stroke-width="2.5"/>
    ${b ? `<polygon points="${poly(b)}" fill="#3d5afe" fill-opacity=".15" stroke="#3d5afe" stroke-width="2.5" stroke-dasharray="6 4"/>` : ''}
    ${labels}</svg>`;
}
function dimBars(v) {
  return DIMS.map(d => `<div class="dimbar"><span>${d.emoji} ${d.name}</span><span class="t"><i style="width:${v[d.k]}%;background:${d.color}"></i></span><b>${v[d.k]}</b></div>`).join('');
}

  ];

function budgetCalc() {
  const f = S.fest, lineup = f.lineup.reduce((a, l) => a + num(l.fee), 0), booths = f.booths.reduce((a, b) => a + num(b.cost), 0);
  const parts = [['음향', num(f.sound), '#3d5afe'], ['조명', num(f.light), '#ffb400'], ['라인업', lineup, '#ff4fa3'], ['부스', booths, '#00c389'], ['홍보', num(f.promo), '#9b5cff'], ['기타', num(f.etc), '#888']];
  return { parts, spent: parts.reduce((a, p) => a + p[1], 0), budget: Math.min(num(f.budget), BUDGET_MAX) };
}
function suggestedBudget() {
  const f = S.fest;
  let pts = festItems().filter(i => i[1]).length * 8;
  pts += Math.min(12, f.purpose.length * 3 + (f.purposeText.trim().length >= 40 ? 3 : 0));
  pts += Math.min(12, Math.floor(f.detail.trim().length / 25));
  pts += Math.min(6, f.booths.filter(b => b.name.trim()).length * 2) + Math.min(6, f.timetable.filter(t => t.act.trim()).length);
  return Math.round((3000000 + Math.min(100, pts) / 100 * 4000000) / 100000) * 100000;
}
function budgetPanel() {
  const f = S.fest, b = budgetCalc(), remain = b.budget - b.spent, warns = [];
  if (!b.budget) warns.push('선생님께 기획안을 보여 주고 예산을 배정받으세요.');
  if (b.budget && remain < 0) warns.push(`예산을 ${won(-remain)} 초과했어요!`);
  if (!num(f.sound)) warns.push('음향비가 0원이면 공연을 할 수 없어요.');
  return `<h3>💰 예산 게임</h3>

    <input type="range" min="0" max="${LIGHT_MAX}" step="10000" data-path="fest.light" value="${f.light}">
    <div class="grid g2" style="gap:8px"><div><label class="f">📣 홍보비</label><input type="number" step="10000" min="0" data-path="fest.promo" value="${f.promo}"></div><div><label class="f">🧰 기타(안전·운영)</label><input type="number" step="10000" min="0" data-path="fest.etc" value="${f.etc}"></div></div>

function budgetSummary() {

  const E = evalAreas();
  const rows = (arr, key) => arr.map((x, k) => `<tr><td style="width:24px"><b>${k + 1}</b></td><td>${x.label}<div class="muted small">${x.why}</div></td>
    <td style="width:70px;text-align:center">${x.teacher ? '👩‍🏫' : x.auto ? '✅' : '⬜'}<div class="muted small">${x.teacher ? '교사 확인' : '자동'}</div></td>
    <td style="width:120px"><select data-manual="${key}" data-i="${k}"><option value="0" ${x.man === 0 ? 'selected' : ''}>${x.teacher ? '미확인' : '자동 판정'}</option><option value="1" ${x.man === 1 ? 'selected' : ''}>교사 인정</option><option value="-1" ${x.man === -1 ? 'selected' : ''}>교사 미인정</option></select></td>
    <td style="width:40px;text-align:center;font-size:20px">${x.final ? '🟢' : '⚪'}</td></tr>`).join('');
  return `
  <div class="row between" style="margin-bottom:12px"><div><h2>✅ 수행평가 체크리스트 (40점)</h2><div class="muted">영역 1은 종이 활동지를 보고 교사가 인정/미인정을 골라요. 영역 2는 앱 활동으로 자동 판정 후 교사가 조정할 수 있어요.</div></div>
    <button class="blue" data-act="copyEval">📋 평가 결과 복사</button></div>
  <div class="grid g3">
    <div class="card"><div class="muted">영역 1 · 음악 취향 보고서</div><div class="score">${S.absent ? '-' : E.s1}<span class="muted" style="font-size:16px"> / 20</span></div></div>
    <div class="card"><div class="muted">영역 2 · 축제 기획·홍보</div><div class="score">${S.absent ? '-' : E.s2}<span class="muted" style="font-size:16px"> / 20</span></div></div>
    <div class="card" style="background:var(--accent);color:#fff"><div>${esc(studentTag())} · 총점</div><div class="score">${E.total}<span style="font-size:16px"> / 40</span></div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>영역 1. 음악 취향 데이터 보고서 작성하기 (20점)</h3><table class="rubric">${rows(E.A1, 'a1')}</table></div>
  <div class="card"><h3>영역 2. 축제 기획 및 홍보하기 (20점)</h3><table class="rubric">${rows(E.A2, 'a2')}</table></div>
  <div class="card"><div class="muted">채점 구조: 영역별 4개 요소 만족 20점 · 3개 16점 · 2개 12점 · 1개 8점 · 미만족 4점 (기본 점수 8점, 미인정 결시/불성실 참여 시 3점)</div>
    <label class="row" style="margin-top:8px;font-weight:700"><input type="checkbox" data-act="absent" ${S.absent ? 'checked' : ''}> 미인정 결시 / 불성실 참여 (총점 3점 처리)</label></div>`;
};

/* =========================================================
   7. 렌더 & 이벤트
   ========================================================= */
function applyChrome() {
  document.documentElement.dataset.theme = PREF.theme;
  document.body.classList.toggle('mobile', PREF.mobile);
  $('#themeSel').value = PREF.theme;
  $('#viewToggle').textContent = PREF.mobile ? '🖥️ 16:9' : '📱 9:16';
}
function render() {
  if (!S && VIEW !== 'home') VIEW = 'home';
  applyChrome(); renderNav();
  $('#view').innerHTML = (VIEWS[VIEW] || VIEWS.home)();
  if (VIEW === 'booth') { drawQR(); fbHint(); }
}
function go(v) { VIEW = v; if (S) { S.view = v; save(); } render(); $('#view').scrollTop = 0; window.scrollTo(0, 0); }
function keepScroll(fn) { const v = $('#view'), y = v.scrollTop, wy = window.scrollY; fn(); v.scrollTop = y; window.scrollTo(0, wy); }

function fbHint() {
  const h = $('#fbHint'); if (!h) return;
  const soft = /(면 어떨까|면 좋겠|추천|제안|바꾸|추가|줄이|늘리)/.test(fbDraft.suggest);
  h.innerHTML = `건설적 피드백 체크: ${fbDraft.good.trim().length >= 10 ? '✅' : '⬜'} 좋았던 점 10자↑ · ${fbDraft.suggest.trim().length >= 15 ? '✅' : '⬜'} 개선 제안 15자↑ · ${soft ? '✅' : '⬜'} 대안 제시("~하면 어떨까?")`;
}
function drawQR() {
  const box = $('#qrbox'); if (!box) return;
  box.innerHTML = '';
  if (typeof QRCode === 'undefined') { box.innerHTML = '<div class="small" style="color:#111">QR 기능을 불러오지 못했어요. 인터넷 연결을 확인하세요.</div>'; return; }
  try { new QRCode(box, { text: boothUrl(), width: 220, height: 220, correctLevel: QRCode.CorrectLevel.L }); if (!S.booth.qrMade) { S.booth.qrMade = true; save(); } }
  catch (e) { box.innerHTML = '<div class="small" style="color:#111">링크가 너무 길어 QR을 만들 수 없어요. 유튜브 재생목록 모드를 쓰세요.</div>'; }
}
function refreshDerived(path) {
  if (VIEW === 'input') {
    $('#inputPanel').innerHTML = inputPanel();
    ['tempo', 'energy', 'mood'].forEach(k => { const o = $(`[data-out="${k}"]`); if (o) o.textContent = WORD[k][S.input[k] - 1]; });
  }
  if (VIEW === 'fest') {
    if (/^fest\.(budget|sound|light|promo|etc)$/.test(path)) {
      $('[data-out="sound"]').textContent = won(S.fest.sound); $('[data-out="light"]').textContent = won(S.fest.light);
      $('[data-live="budget"]').innerHTML = budgetSummary();
    } else $('#budgetPanel').innerHTML = budgetPanel();
  }
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'lg_no') { loginDraft.no = t.value; return updateLoginBtn(); }
  if (t.id === 'lg_name') { loginDraft.name = t.value; return updateLoginBtn(); }
  if (!S) return;
  if (t.dataset.path) {
    let v = t.value;
    if (t.type === 'number' || t.type === 'range') v = num(v);
    if (t.dataset.path === 'fest.budget' && v > BUDGET_MAX) v = BUDGET_MAX;
    setPath(t.dataset.path, v); save(); refreshDerived(t.dataset.path);
  }
  if (t.dataset.checkwhy) { S.checks[t.dataset.checkwhy].why = t.value; save(); }
  if (t.dataset.self) {
    if (!S.self) S.self = { ...computeDims() };
    S.self[t.dataset.self] = +t.value; save();
    $(`[data-out="self${t.dataset.self}"]`).textContent = t.value;
  }
  if (t.id === 'fb_to') fbDraft.to = t.value;
  if (t.id === 'fb_good') { fbDraft.good = t.value; fbHint(); }
  if (t.id === 'fb_suggest') { fbDraft.suggest = t.value; fbHint(); }
});
function updateLoginBtn() { const b = $('[data-act="login"]'); if (b) b.disabled = !(loginDraft.cls && String(loginDraft.no).trim() && loginDraft.name.trim()); }
document.addEventListener('change', e => {
  const t = e.target; if (!S) return;
  if (t.dataset.checkwhy || t.dataset.self) return keepScroll(render);   // 입력을 마치면 상태 표시 갱신
  if (t.dataset.tier !== undefined) { S.fest.lineup[+t.dataset.tier].fee = TIERS.find(x => x.name === t.value).fee; save(); keepScroll(render); }
  if (t.dataset.boothkind !== undefined) { S.fest.booths[+t.dataset.boothkind].cost = BOOTH_KINDS.find(x => x.name === t.value).cost; save(); keepScroll(render); }
  if (t.dataset.manual) { S.manual[t.dataset.manual][+t.dataset.i] = +t.value; save(); keepScroll(render); }
  if (t.dataset.path === 'fest.budget') keepScroll(render);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'lg_name' || e.target.id === 'lg_no')) ACTIONS.login(); if (e.key === 'Escape') closeModal(); });
$('#themeSel').addEventListener('change', e => { PREF.theme = e.target.value; savePref(); applyChrome(); });
$('#viewToggle').addEventListener('click', () => { PREF.mobile = !PREF.mobile; savePref(); render(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-cls],[data-chip],[data-radio],[data-add],[data-del],[data-act],[data-rate],[data-genre],[data-check],[data-star],[data-play]');
  if (!t) return;
  const d = t.dataset;
  if (d.nav) return S ? go(d.nav) : go('home');
  if (d.cls) { loginDraft.cls = +d.cls; loginDraft.no = $('#lg_no').value; loginDraft.name = $('#lg_name').value; return render(); }
  if (d.play) return playThumb(t);
  if (d.act && ACTIONS[d.act]) return ACTIONS[d.act](t, e);
  if (d.genre) return openModal(genreCard(GENRES.find(g => g.k === d.genre)).replace('class="card gcard" style="margin:0"', 'class="gcard"'));
  if (!S) return;
  if (d.rate) {
    S.input.genres[d.rate] = +d.v; save(); keepScroll(render);
    if (+d.v < 0) { const g = GENRES.find(x => x.k === d.rate); openModal(`<div class="notice small" style="margin-bottom:10px">❓ 잘 모르는 장르네요! 카드를 읽고 들어본 뒤, 마음에 들면 다시 골라 주세요.</div>` + genreCard(g).replace('class="card gcard" style="margin:0"', 'class="gcard"')); }
    return;
  }
  if (d.chip) { const arr = getPath(d.chip); const k = arr.indexOf(d.val); k >= 0 ? arr.splice(k, 1) : arr.push(d.val); save(); return keepScroll(render); }
  if (d.radio) { setPath(d.radio, d.val); save(); return keepScroll(render); }
  if (d.add) { S.fest[d.add].push(ROW_TPL[d.add]()); save(); return keepScroll(render); }
  if (d.del) { S.fest[d.del].splice(+d.i, 1); save(); return keepScroll(render); }
  if (d.check) { S.checks[d.check] = Object.assign(S.checks[d.check] || {}, { v: d.v }); save(); keepScroll(render); const w = $(`[data-checkwhy="${d.check}"]`); if (w && d.v !== 'yes') w.focus(); return; }
  if (d.star) { fbDraft[d.star] = +d.n; return keepScroll(render); }
});
function playThumb(t) {
  const fr = document.createElement('iframe');
  fr.src = `https://www.youtube-nocookie.com/embed/${t.dataset.play}?autoplay=1`; fr.allow = 'autoplay; encrypted-media; picture-in-picture'; fr.allowFullscreen = true;
  t.replaceWith(fr);
}

const ACTIONS = {
  closeModal,
  login() {
    loginDraft.no = ($('#lg_no') || {}).value ?? loginDraft.no; loginDraft.name = ($('#lg_name') || {}).value ?? loginDraft.name;
    if (!loginDraft.cls) return toast('반을 먼저 골라 주세요.');
    if (!String(loginDraft.no).trim() || !loginDraft.name.trim()) return toast('번호와 이름을 입력해 주세요.');
    login(loginDraft.cls, loginDraft.no, loginDraft.name);
  },
  continue() { const id = store.get(K_LAST, null); if (USERS[id]) { UID = id; S = USERS[id]; go(S.view || 'input'); } },
  pick(t) { const u = USERS[t.dataset.id]; if (u && confirm(`${u.student.cls}반 ${u.student.no}번 ${u.student.name} 학생이 맞나요?`)) { UID = t.dataset.id; S = u; store.set(K_LAST, UID); go(S.view || 'input'); } },
  logout() { if (confirm('나가면 다른 학생이 이 기기를 쓸 수 있어요. 내 기록은 저장돼 있어요. 나갈까요?')) logout(); },
  sendLink() {
    const url = appBase() + '#load=' + enc({ student: S.student, input: S.input });
    const text = `🎧 ${studentTag()}의 음악 취향 과제 — 학교 노트북에서 이 링크를 누르세요`;
    if (navigator.share) navigator.share({ title: '나의 음악 취향 과제', text, url }).catch(() => {});
    else copyText(url, '링크를 복사했어요! 카카오톡 나와의 채팅 등에 붙여넣으세요.');
  },
  resetSelf() { S.self = null; save(); keepScroll(render); },
  songsToSetlist() {
    const songs = S.input.songs.filter(s => s.t.trim());
    S.fest.setlist = S.fest.setlist.filter(x => x.song.trim() || x.url.trim());
    songs.forEach(s => { if (!S.fest.setlist.some(x => x.song === s.t)) S.fest.setlist.push({ artist: s.a, song: s.t, url: '' }); });
    if (!S.fest.setlist.length) S.fest.setlist.push(ROW_TPL.setlist());
    save(); keepScroll(render); toast('셋리스트에 넣었어요! 유튜브 링크를 붙여넣어 주세요.');
  },
  suggestBudget() { S.fest.budget = suggestedBudget(); save(); keepScroll(render); },
  copyBooth() { copyText(boothUrl(), '청음 링크를 복사했어요!'); },
  downloadQR() {
    const img = $('#qrbox img'), cv = $('#qrbox canvas');
    const src = img && img.src && img.src.startsWith('data:') ? img.src : cv ? cv.toDataURL('image/png') : null;
    if (!src) return;
    const a = document.createElement('a'); a.href = src; a.download = `청음QR_${S.fest.name || '축제'}.png`; a.click();
  },
  addFeedback() {
    if (!fbDraft.to.trim()) return toast('피드백 대상을 입력해 주세요.');
    if (!fbDraft.good.trim() || !fbDraft.suggest.trim()) return toast('좋았던 점과 개선 제안을 모두 써 주세요.');
    S.feedback.push({ ...fbDraft, at: Date.now() }); fbDraft = { to: '', lineup: 0, plan: 0, poster: 0, listen: 0, good: '', suggest: '' };
    save(); keepScroll(render); toast('📮 피드백을 남겼어요!');
  },
  delFeedback(t) { S.feedback.splice(+t.dataset.i, 1); save(); keepScroll(render); },
  poster() { openPoster(); },
  copySummary() { copyText(festSummaryText(), '기획 요약서를 복사했어요!'); },
  copyEval() {
    const E = evalAreas(), lines = a => a.map((x, k) => `${k + 1}. ${x.final ? '○' : '×'} ${x.label}`).join('\n');
    copyText(`[수행평가] ${studentTag()}\n영역1 ${S.absent ? '-' : E.s1}/20\n${lines(E.A1)}\n영역2 ${S.absent ? '-' : E.s2}/20\n${lines(E.A2)}\n총점 ${E.total}/40`, '평가 결과를 복사했어요!');
  },
  absent(t) { S.absent = t.checked; save(); keepScroll(render); }
};

/* ----- A5 포스터 ----- */
function festSummaryText() {
  const f = S.fest, b = budgetCalc();
  return `[축제 기획 요약서] ${f.name}
슬로건: ${f.slogan}
유형: ${f.type === 'school' ? '학교 축제' : '취향 맞춤형 축제'} / 일시: ${f.date} / 장소: ${f.venue}
목적: ${f.purpose.join(', ')} ${f.purposeText}
라인업: ${f.lineup.filter(l => l.artist).map(l => `${l.tier} ${l.artist}`).join(' / ')}
타임테이블: ${f.timetable.filter(t => t.act).map(t => `${t.time} ${t.stage} ${t.act}`).join(' / ')}
셋리스트: ${f.setlist.filter(s => s.song).map(s => `${s.artist} - ${s.song}`).join(' / ')}
부스: ${f.booths.filter(x => x.name).map(x => `${x.kind} ${x.name}`).join(' / ')}
예산: 배정 ${won(b.budget)} · 집행 ${won(b.spent)} (${b.parts.map(p => `${p[0]} ${won(p[1])}`).join(', ')})
관람 안내: ${f.guide}
세부 설명: ${f.detail}`;
}
function openPoster() {
  const f = S.fest, by = n => f.lineup.filter(l => l.tier === n && l.artist.trim()).map(l => esc(l.artist));
  const heads = [...by('헤드라이너'), ...by('첫 내한/쇼케이스')], subs = by('서브 헤드라이너'), rest = [...by('미들 라인업'), ...by('언더카드'), ...by('루키')];
  const colors = ['#ff4fa3', '#3d5afe', '#00c389', '#ffb400', '#9b5cff'];
  const blobs = [0, 1, 2].map(k => `<div class="blob" style="width:${60 + k * 25}mm;height:${60 + k * 25}mm;background:${colors[(k + f.name.length) % 5]};${['top:-20mm;right:-20mm', 'bottom:30mm;left:-30mm', 'bottom:-40mm;right:-10mm'][k]}"></div>`).join('');
  $('#posterWrap').innerHTML = `<div class="row no-print" style="justify-content:center;margin-bottom:14px"><button class="primary" id="pPrint">🖨️ 인쇄 / PDF 저장 (A5)</button><button id="pClose">닫기</button></div>
    <div class="poster">${blobs}
      <div class="pd">${f.type === 'school' ? 'SCHOOL MUSIC FESTIVAL' : 'MUSIC FESTIVAL'}</div><div class="pt">${esc(f.name || '축제명')}</div><div class="ps">${esc(f.slogan)}</div>
      <div class="pd">📅 ${esc(f.date)}<br>📍 ${esc(f.venue)}</div>
      <div style="margin-top:4mm">${heads.length ? `<div class="head">${heads.join(' · ')}</div>` : ''}${subs.length ? `<div class="sub">${subs.join(' · ')}</div>` : ''}${rest.length ? `<div class="rest">${rest.join(' · ')}</div>` : ''}</div>
      <div class="tt">${f.timetable.filter(t => t.act.trim()).slice(0, 6).map(t => `${esc(t.time)} ${esc(t.stage)} ${esc(t.act)}`).join('<br>')}</div>
      <div class="tt">${f.booths.filter(b => b.name.trim()).slice(0, 4).map(b => `◆ ${esc(b.name)}`).join('  ')}</div>
      <div class="foot"><div class="tt" style="max-width:85mm">${esc(f.guide.slice(0, 160))}</div><div><div class="pqr" id="posterQR"></div><div class="pd" style="text-align:center;font-size:9px;margin-top:2px">SCAN · 셋리스트 청음</div></div></div>
    </div>`;
  $('#posterWrap').classList.add('show');
  const url = boothUrl();
  if (url && typeof QRCode !== 'undefined') { try { new QRCode($('#posterQR'), { text: url, width: 160, height: 160, correctLevel: QRCode.CorrectLevel.L }); } catch (e) {} } else $('#posterQR').style.display = 'none';
  $('#pClose').onclick = () => $('#posterWrap').classList.remove('show');
  $('#pPrint').onclick = () => { document.body.classList.add('printing'); window.print(); };
  S.booth.posterMade = true; save();
}
window.addEventListener('afterprint', () => document.body.classList.remove('printing'));

/* ----- QR로 접속한 청음 페이지 ----- */
function renderBoothOnly(p) {
  document.documentElement.dataset.theme = PREF.theme;
  document.body.innerHTML = `<div class="solo"><div class="card hero"><div class="small" style="font-weight:900;letter-spacing:2px">DIGITAL LISTENING BOOTH</div><h1>${esc(p.n || '뮤직 페스티벌')}</h1><div>${esc(p.s || '')}</div><div class="small" style="margin-top:6px">${esc([p.d, p.v].filter(Boolean).join(' · '))}</div></div>
    <div class="card"><h3>🎶 셋리스트</h3>${tracksHTML(p.t || [])}</div><div class="card muted small">청음 후 부스의 피드백 포스트잇에 좋았던 점과 개선 제안을 남겨 주세요! 🎪</div></div>`;
  document.body.addEventListener('click', e => { const t = e.target.closest('[data-play]'); if (t) playThumb(t); });
}

/* =========================================================
   8. 시작
   ========================================================= */
(function boot() {
  const h = location.hash;
  if (h.startsWith('#booth=')) { try { return renderBoothOnly(dec(h.slice(7))); } catch (e) {} }
  if (h.startsWith('#load=')) {
    try {
      const d = dec(h.slice(6)), st = d.student;
      history.replaceState(null, '', appBase());
      if (st && d.input && confirm(`📥 ${st.cls}반 ${st.no}번 ${st.name} 학생의 과제를 이 기기로 불러올까요?`)) {
        const id = uidOf(st.cls, st.no, st.name);
        if (!USERS[id]) USERS[id] = newUser(st.cls, st.no, st.name);
        USERS[id].input = Object.assign(newUser(1, '', '').input, d.input);
        UID = id; S = USERS[id]; store.set(K_LAST, id); store.set(K_USERS, USERS);
        toast('과제를 불러왔어요! 결과를 확인해 보세요.');
        return go('result');
      }
    } catch (e) { toast('링크가 손상되어 불러오지 못했어요.'); }
  }
  render();
})();
</script>
